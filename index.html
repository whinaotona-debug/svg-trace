<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scratch SVG Paint</title>
  <style>
    :root {
      --purple: #855cd6;
      --purple-soft: #e9d9f7;
      --fill: #cf63cf;
      --bg: #d9e3ea;
      --panel: #f2f7fb;
      --line: #c2d0db;
      --text: #575e75;
      --ink: #222;
      --tool: 42px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Helvetica Neue", "Segoe UI", sans-serif; user-select: none; }
    button, input { font-family: inherit; }
    .app { height: 100%; display: grid; grid-template-rows: 48px 1fr 42px; }
    .topbar {
      display: flex; align-items: center; gap: 8px; padding: 0 10px;
      background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto;
    }
    .name-wrap { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
    .name-wrap input { width: 110px; height: 28px; border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; }
    .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: 0 0 auto; }
    .ibtn {
      width: 32px; height: 32px; border: 0; background: transparent; border-radius: 4px; cursor: pointer;
      color: var(--text); display: grid; place-items: center;
    }
    .ibtn:hover { background: #e6eef5; }
    .ibtn:disabled { opacity: .35; cursor: default; }
    .ibtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .color-field { display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
    .swatch { position: relative; width: 22px; height: 22px; }
    .swatch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .chip { width: 100%; height: 100%; border-radius: 4px; border: 1px solid #9aaebb; pointer-events: none; }
    .none .chip { background: linear-gradient(135deg, transparent 46%, #d0021b 46% 54%, transparent 54%), #fff; }
    .width-num { width: 42px; height: 26px; border: 1px solid var(--line); border-radius: 4px; text-align: center; }
    .grow { flex: 1; }
    .ai-btn, .save-btn {
      height: 30px; padding: 0 10px; border: 0; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 700;
    }
    .ai-btn { background: #ffbf00; color: #111; }
    .save-btn { background: var(--purple); color: #fff; }

    .workspace { display: grid; grid-template-columns: 58px 1fr; min-height: 0; }
    .toolbar {
      background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;
    }
    .tool {
      width: var(--tool); height: var(--tool); border: 0; background: transparent; border-radius: 8px;
      color: var(--text); cursor: pointer; display: grid; place-items: center; position: relative;
    }
    .tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tool:hover { background: #e6eef5; }
    .tool.active { background: var(--purple); color: #fff; }
    .hint {
      position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
      background: #111; color: #fff; font-size: 11px; padding: 4px 6px; border-radius: 4px; white-space: nowrap;
      pointer-events: none; opacity: 0; z-index: 20;
    }
    .tool:hover .hint { opacity: 1; }

    .stage { min-width: 0; min-height: 0; position: relative; background: #c8d4de; }
    .paper {
      position: absolute; inset: 0; overflow: hidden;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #eceff4 25%, transparent 25%),
        linear-gradient(-45deg, #eceff4 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eceff4 75%),
        linear-gradient(-45deg, transparent 75%, #eceff4 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    svg.canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    svg.canvas.select, svg.canvas.reshape, svg.canvas.fill { cursor: default; }
    svg.canvas.eraser { cursor: cell; }
    svg.canvas.text { cursor: text; }

    .bottombar {
      display: flex; align-items: center; justify-content: flex-end; gap: 6px;
      padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line);
    }
    .zoom-btn {
      width: 34px; height: 28px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; color: var(--text);
    }
    .zoom-label { min-width: 48px; text-align: center; font-size: 12px; }

    .toast {
      position: fixed; right: 16px; bottom: 52px; background: #333; color: #fff; padding: 8px 12px; border-radius: 8px;
      font-size: 13px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .25s; z-index: 50;
    }
    .toast.show { opacity: 1; transform: none; }

    .import-view { display: none; min-height: 100%; background: var(--bg); }
    body.import-open { overflow: auto; }
    body.import-open .app { display: none; }
    body.import-open .import-view { display: block; }
    .import-bar { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .import-bar .back-btn, .import-actions .back-btn {
      background: #575e75;
      color: #fff;
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .import-wrap { width: min(860px, calc(100% - 32px)); margin: 24px auto 48px; background: #fff; border-radius: 12px; padding: 22px; }
    .import-wrap h2 { color: var(--ink); margin-bottom: 6px; }
    .import-wrap .lead, .import-wrap label { color: #667; font-size: 13px; margin-bottom: 10px; }
    .import-wrap label { display: grid; gap: 6px; }
    .import-wrap input, .import-wrap textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; }
    .import-wrap textarea { min-height: 72px; }
    .key-row, .import-actions, .import-tabs, .examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .key-row input { flex: 1; }
    .import-tabs button, .ghost, .go, .ex { border: 1px solid var(--line); background: #f4f7fb; height: 34px; padding: 0 12px; border-radius: 8px; cursor: pointer; }
    .import-tabs button.active, .go { background: var(--purple); color: #fff; border-color: transparent; }
    .go { height: 42px; font-weight: 700; }
    .go:disabled { opacity: .4; }
    .drop { border: 1.5px dashed var(--line); border-radius: 12px; min-height: 140px; display: grid; place-items: center; background: #f7fafc; cursor: pointer; }
    .drop.drag { border-color: var(--purple); background: var(--purple-soft); }
    .drop input { display: none; }
    .preview-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pv { border: 1px solid var(--line); border-radius: 10px; min-height: 180px; display: grid; place-items: center; background: #fafafa; overflow: hidden; }
    .pv img, .pv svg { max-width: 100%; max-height: 200px; }
    .import-status { font-size: 13px; min-height: 18px; margin: 10px 0; }
    .import-status.err { color: #d0021b; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #selection-ui { pointer-events: none; }
    svg.canvas.select #selection-ui .handle, svg.canvas.select #selection-ui .rot-handle,
    svg.canvas.reshape #selection-ui .node { pointer-events: auto; cursor: pointer; }
    .hidden { display: none !important; }
    @media (max-width: 640px) { .preview-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <label class="name-wrap">コスチューム <input id="costume-name" value="costume1" /></label>
      <div class="sep"></div>
      <button class="ibtn" id="btn-undo" title="元に戻す" disabled><svg viewBox="0 0 24 24"><path d="M9 7H5V3"/><path d="M5 7a8 8 0 1 1-1.3 6.2"/></svg></button>
      <button class="ibtn" id="btn-redo" title="やり直す" disabled><svg viewBox="0 0 24 24"><path d="M15 7h4V3"/><path d="M19 7a8 8 0 1 0 1.3 6.2"/></svg></button>
      <div class="sep"></div>
      <button class="ibtn" id="btn-group" title="グループ化"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="10" height="8"/><rect x="10" y="11" width="10" height="8"/></svg></button>
      <button class="ibtn" id="btn-ungroup" title="グループ解除"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="8" height="7"/><rect x="13" y="11" width="8" height="7"/></svg></button>
      <div class="sep"></div>
      <button class="ibtn" id="btn-forward" title="ひとつ前面へ"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button>
      <button class="ibtn" id="btn-backward" title="ひとつ背面へ"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg></button>
      <button class="ibtn" id="btn-front" title="最前面へ"><svg viewBox="0 0 24 24"><rect x="7" y="8" width="11" height="10"/><rect x="4" y="4" width="11" height="10"/></svg></button>
      <button class="ibtn" id="btn-back" title="最背面へ"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="11" height="10"/><rect x="7" y="8" width="11" height="10"/></svg></button>
      <div class="sep"></div>
      <div class="color-field">塗りつぶし
        <label class="swatch" id="fill-wrap"><span id="fill-chip" class="chip" style="background:#cf63cf"></span><input id="fill-color" type="color" value="#cf63cf" /></label>
        <button class="ibtn" id="btn-no-fill" title="塗りなし"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6 18L18 6"/></svg></button>
      </div>
      <div class="color-field">枠線
        <label class="swatch" id="stroke-wrap"><span id="stroke-chip" class="chip" style="background:#111111"></span><input id="stroke-color" type="color" value="#111111" /></label>
        <input class="width-num" id="stroke-width" type="number" min="0" max="80" value="4" />
      </div>
      <div class="sep"></div>
      <button class="ibtn" id="btn-copy" title="コピー"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/></svg></button>
      <button class="ibtn" id="btn-paste" title="貼り付け"><svg viewBox="0 0 24 24"><path d="M8 8h11v12H8z"/><path d="M5 16V4h10"/></svg></button>
      <button class="ibtn" id="btn-delete" title="削除"><svg viewBox="0 0 24 24"><path d="M6 8h12"/><path d="M9 8V6h6v2"/><path d="M8 8l1 12h6l1-12"/></svg></button>
      <div class="sep"></div>
      <button class="ibtn" id="btn-flip-h" title="左右反転"><svg viewBox="0 0 24 24"><path d="M12 4v16"/><path d="M5 8l7 4-7 4z"/><path d="M19 8l-7 4 7 4z"/></svg></button>
      <button class="ibtn" id="btn-flip-v" title="上下反転"><svg viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M8 5l4 7-4 7"/><path d="M16 5l-4 7 4 7"/></svg></button>
      <div class="grow"></div>
      <button class="ai-btn" id="btn-ai" type="button">画像から取込</button>
      <button class="save-btn" id="btn-export" type="button">SVG保存</button>
    </header>

    <div class="workspace">
      <aside class="toolbar">
        <button class="tool active" data-tool="select"><svg viewBox="0 0 24 24"><path d="M5 4l6 16 2.2-6.2L19.5 12z"/></svg><span class="hint">選択</span></button>
        <button class="tool" data-tool="reshape"><svg viewBox="0 0 24 24"><path d="M5 5l8 14 1.5-6L21 11z"/><circle cx="18" cy="18" r="2.2" fill="currentColor" stroke="none"/></svg><span class="hint">再変形</span></button>
        <button class="tool" data-tool="pen"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg><span class="hint">筆</span></button>
        <button class="tool" data-tool="eraser"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7-4 4H9z"/></svg><span class="hint">消しゴム</span></button>
        <button class="tool" data-tool="fill"><svg viewBox="0 0 24 24"><path d="M7 14l6-8 6 8H7z"/><path d="M8 17h8"/></svg><span class="hint">塗りつぶし</span></button>
        <button class="tool" data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6h14"/><path d="M12 6v14"/><path d="M8 20h8"/></svg><span class="hint">テキスト</span></button>
        <button class="tool" data-tool="line"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg><span class="hint">直線</span></button>
        <button class="tool" data-tool="ellipse"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><span class="hint">円</span></button>
        <button class="tool" data-tool="rect"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12"/></svg><span class="hint">四角形</span></button>
      </aside>
      <main class="stage">
        <div class="paper">
          <svg class="canvas select" id="canvas" xmlns="http://www.w3.org/2000/svg">
            <g id="objects"></g>
            <g id="preview"></g>
            <g id="selection-ui"></g>
          </svg>
        </div>
      </main>
    </div>

    <footer class="bottombar">
      <button class="zoom-btn" id="zoom-out" title="縮小">−</button>
      <button class="zoom-btn" id="zoom-reset" title="100%">=</button>
      <button class="zoom-btn" id="zoom-in" title="拡大">+</button>
      <div class="zoom-label" id="zoom-label">100%</div>
    </footer>
  </div>
  <div class="toast" id="toast"></div>

  <div class="import-view" id="view-import">
    <header class="import-bar">
      <strong>画像から取込</strong>
      <button class="back-btn" id="btn-close-ai" type="button">キャンバスへ戻る</button>
    </header>
    <div class="import-wrap">
      <h2>画像からキャンバスへ</h2>
      <p class="lead">トレースボットが色面をたどってSVGにします。変換後はキャンバス中央に置かれ、選択して動かせます。</p>
      <div class="import-tabs">
        <button type="button" class="active" data-tab="upload">画像をアップロード</button>
        <button type="button" data-tab="generate">AIで画像を生成</button>
      </div>
      <div id="panel-upload">
        <label class="drop" id="dropzone"><input id="file" type="file" accept="image/png,image/jpeg,image/jpg,image/webp" />PNG / JPG をドロップ、またはクリック</label>
      </div>
      <div id="panel-generate" class="hidden">
        <label>プロンプト<textarea id="prompt" placeholder="simple cute cat icon, flat design, white background"></textarea></label>
        <div class="examples">
          <button type="button" class="ex" data-prompt="simple cute cat icon, flat design, vector style, white background">かわいい猫</button>
          <button type="button" class="ex" data-prompt="simple red apple icon, flat design, bold shapes, white background">りんご</button>
          <button type="button" class="ex" data-prompt="minimal mountain landscape logo, geometric, flat colors">山のロゴ</button>
        </div>
        <button class="go" id="btn-generate" type="button">画像を生成</button>
      </div>
      <div class="preview-row">
        <div><div class="lead">元画像</div><div class="pv" id="source-frame">未選択</div></div>
        <div><div class="lead">変換プレビュー</div><div class="pv" id="svg-frame">まだありません</div></div>
      </div>
      <div class="import-status" id="ai-status">画像を用意してから変換してください</div>
      <div class="import-actions">
        <button class="go" id="btn-convert" type="button" disabled>トレースしてキャンバスへ</button>
        <button class="back-btn" id="btn-close-ai-2" type="button">キャンバスへ戻る</button>
      </div>
    </div>
  </div>

  <script src="config.local.js"></script>
  <script>
    const svgNS = "http://www.w3.org/2000/svg";
    const canvas = document.getElementById("canvas");
    const objectsLayer = document.getElementById("objects");
    const previewLayer = document.getElementById("preview");
    const selectionLayer = document.getElementById("selection-ui");
    const HANDLE_POS = { nw:[0,0], n:[.5,0], ne:[1,0], e:[1,.5], se:[1,1], s:[.5,1], sw:[0,1], w:[0,.5] };

    const state = {
      tool: "select",
      fill: "#cf63cf",
      fillNone: false,
      stroke: "#111111",
      strokeWidth: 4,
      objects: [],
      selectedIds: [],
      history: [],
      future: [],
      clipboard: [],
      drawing: null,
      gesture: null,
      applyingUI: false,
      zoom: 1,
      panX: 0,
      panY: 0,
    };

    const uid = () => "o" + Math.random().toString(36).slice(2, 10);
    const identity = () => [1, 0, 0, 1, 0, 0];
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const currentFill = () => (state.fillNone ? "none" : state.fill);
    const selectedObjects = () => state.objects.filter((o) => state.selectedIds.includes(o.id));
    const selected = () => selectedObjects()[0] || null;

    function multiply(a, b) {
      return [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
    }
    function invert(m) {
      const [a,b,c,d,e,f] = m, det = a*d - c*b;
      if (Math.abs(det) < 1e-8) return identity();
      return [d/det, -b/det, -c/det, a/det, (c*f-d*e)/det, (b*e-a*f)/det];
    }
    function applyMat(m, x, y) { return { x: m[0]*x + m[2]*y + m[4], y: m[1]*x + m[3]*y + m[5] }; }
    function mTranslate(tx, ty) { return [1,0,0,1,tx,ty]; }
    function mScale(sx, sy) { return [sx,0,0,sy,0,0]; }
    function mRotate(rad) { const c=Math.cos(rad), s=Math.sin(rad); return [c,s,-s,c,0,0]; }
    function svgPoint(evt) {
      const pt = canvas.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      return pt.matrixTransform(canvas.getScreenCTM().inverse());
    }
    function createEl(name, attrs={}) {
      const el = document.createElementNS(svgNS, name);
      for (const [k,v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
      return el;
    }
    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text; el.classList.add("show");
      clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }
    function applyView() {
      const r = canvas.getBoundingClientRect();
      const w = Math.max(1, r.width / state.zoom);
      const h = Math.max(1, r.height / state.zoom);
      canvas.setAttribute("viewBox", `${state.panX} ${state.panY} ${w} ${h}`);
      document.getElementById("zoom-label").textContent = Math.round(state.zoom * 100) + "%";
    }

    function snapshot() {
      state.history.push({ objects: clone(state.objects), selectedIds: state.selectedIds.slice() });
      if (state.history.length > 80) state.history.shift();
      state.future = [];
      refreshHistoryButtons();
    }
    function undo() {
      if (!state.history.length) return;
      state.future.push({ objects: clone(state.objects), selectedIds: state.selectedIds.slice() });
      const prev = state.history.pop();
      state.objects = clone(prev.objects);
      state.selectedIds = prev.selectedIds || [];
      renderObjects(); syncSelectionUI(); refreshHistoryButtons();
    }
    function redo() {
      if (!state.future.length) return;
      state.history.push({ objects: clone(state.objects), selectedIds: state.selectedIds.slice() });
      const next = state.future.pop();
      state.objects = clone(next.objects);
      state.selectedIds = next.selectedIds || [];
      renderObjects(); syncSelectionUI(); refreshHistoryButtons();
    }
    function refreshHistoryButtons() {
      document.getElementById("btn-undo").disabled = !state.history.length;
      document.getElementById("btn-redo").disabled = !state.future.length;
    }

    function localBBox(obj) {
      if (obj.type === "group") {
        const el = document.getElementById(obj.id);
        if (el) { const b = el.getBBox(); return { x:b.x, y:b.y, w:b.width||1, h:b.height||1 }; }
        return { x:0,y:0,w:1,h:1 };
      }
      if (obj.type === "rect") return { x:obj.x, y:obj.y, w:obj.width, h:obj.height };
      if (obj.type === "ellipse") return { x:obj.cx-obj.rx, y:obj.cy-obj.ry, w:obj.rx*2, h:obj.ry*2 };
      if (obj.type === "text") return { x:obj.x, y:obj.y-obj.fontSize, w: Math.max(20, (obj.text||"").length * obj.fontSize * 0.6), h: obj.fontSize * 1.3 };
      if (obj.type === "line") {
        const x = Math.min(obj.x1,obj.x2), y = Math.min(obj.y1,obj.y2);
        return { x, y, w: Math.abs(obj.x2-obj.x1)||1, h: Math.abs(obj.y2-obj.y1)||1 };
      }
      const el = document.getElementById(obj.id)?.querySelector(".shape");
      if (el) { const b = el.getBBox(); return { x:b.x, y:b.y, w:b.width||1, h:b.height||1 }; }
      return { x:0,y:0,w:1,h:1 };
    }
    function worldCorners(obj) {
      const b = localBBox(obj);
      return [[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]].map(([x,y]) => applyMat(obj.matrix, x, y));
    }
    function unionBox(objs) {
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
      objs.forEach((o) => worldCorners(o).forEach((p) => {
        minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
      }));
      if (!isFinite(minX)) return { x:0,y:0,w:1,h:1 };

    function constrainedRect(a,b,square) {

    function loopToPath(pts) {
      let d = `M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
      for (let i=1;i<pts.length;i++) d += ` L ${pts[i][0].toFixed(2)} ${pts[i][1].toFixed(2)}`;
      return d + " Z";
    }
    async function traceBitmapToSvg(dataUrl) {
      aiStatus("トレースボット: 画像を読み込んでいます...");
      await tick();
      const { imgData, w, h } = await loadImageData(dataUrl, 480);
      const bg = sampleBg(imgData.data, w, h);
      knockBackground(imgData, bg, 42);
      aiStatus("トレースボット: 色をまとめています...");
      await tick();
      const palette = medianCutPalette(imgData, 16);
      if (!palette.length) throw new Error("トレーできる色が見つかりませんでした");
      const labels = quantize(imgData, palette);
      const minPixels = Math.max(20, Math.round(w * h * 0.0007));
      const layers = [];
      for (let pi=0; pi<palette.length; pi++) {
        if (pi % 2 === 0) {
          aiStatus(`トレースボット: 輪郭をたどっています (${pi+1}/${palette.length})...`);
          await tick();
        }
        const mask = colorMask(labels, pi, w, h, minPixels);
        if (!mask) continue;
        removeSpeckles(mask, w, h, 10);
        const segs = extractSegments(mask, w, h);
        if (!segs.length) continue;
        let loops = stitchLoops(segs).map((loop) => {
          let s = simplifyClosed(loop, 1.05);
          s = chaikinClosed(s, 2);
          return simplifyClosed(s, 0.5);
        }).filter((loop) => Math.abs(loopArea(loop)) >= 8);
        if (!loops.length) continue;
        loops.sort((a,b) => Math.abs(loopArea(b)) - Math.abs(loopArea(a)));
        const d = loops.map(loopToPath).join(" ");
        const [r,g,b] = palette[pi];
        const area = loops.reduce((sum, loop) => sum + Math.abs(loopArea(loop)), 0);
        layers.push({ d, fill: rgbHex(r,g,b), area });
      }
      if (!layers.length) throw new Error("輪郭を取り出せませんでした");
      layers.sort((a,b) => b.area - a.area);
      const paths = layers.map((l) => `<path fill="${l.fill}" stroke="none" fill-rule="evenodd" d="${l.d}"/>`).join("");
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${paths}</svg>`;
    }

    function parseTransform(str) {
      if (!str) return identity(); let m=identity(); const re=/(matrix|translate|scale|rotate)\(([^)]+)\)/g; let match;
      while ((match=re.exec(str))) { const args=match[2].trim().split(/[\s,]+/).map(Number);
        if (match[1]==="matrix"&&args.length>=6) m=multiply(m,args.slice(0,6));
        if (match[1]==="translate") m=multiply(m,mTranslate(args[0]||0,args[1]||0));
        if (match[1]==="scale") m=multiply(m,mScale(args[0]||1, args[1]??args[0]??1));
        if (match[1]==="rotate") { const rad=((args[0]||0)*Math.PI)/180; m = args.length>=3 ? multiply(m, multiply(mTranslate(args[1],args[2]), multiply(mRotate(rad), mTranslate(-args[1],-args[2])))) : multiply(m,mRotate(rad)); }
      }
      return m;
    }
    function readPaint(el, inherited) {
      const style={}; (el.getAttribute("style")||"").split(";").forEach(part=>{ const [k,v]=part.split(":"); if(k&&v) style[k.trim()]=v.trim(); });
      const fill=el.getAttribute("fill")||style.fill||inherited.fill; const stroke=el.getAttribute("stroke")||style.stroke||inherited.stroke;
      const swRaw=el.getAttribute("stroke-width")||style["stroke-width"]; const strokeWidth=swRaw?parseFloat(swRaw):inherited.strokeWidth;
      const rule=el.getAttribute("fill-rule")||style["fill-rule"]||inherited.fillRule;
      return { fill: fill||"#000", stroke: stroke||"none", strokeWidth: Number.isFinite(strokeWidth)?strokeWidth:0, fillRule: rule||"evenodd" };
    }
    function polygonToPath(points, close) {
      const nums=String(points||"").trim().split(/[\s,]+/).filter(Boolean); if(nums.length<4) return "";
      let d=""; for(let i=0;i+1<nums.length;i+=2) d+=`${i?"L":"M"} ${nums[i]} ${nums[i+1]} `; if(close) d+="Z"; return d.trim();
    }
    function parseSvgObjects(markup) {
      const doc=new DOMParser().parseFromString(markup,"image/svg+xml"); const root=doc.documentElement;
      if (!root || root.nodeName.toLowerCase()!=="svg" || doc.querySelector("parsererror")) throw new Error("SVGを解析できませんでした");
      const imported=[]; const skip=new Set(["defs","clippath","mask","filter","style","script","title","desc"]);
      function walk(el, inherited, parentMat) {
        const tag=el.localName.toLowerCase(); if (skip.has(tag)) return;
        const paint=readPaint(el,inherited); const mat=multiply(parentMat, parseTransform(el.getAttribute("transform"))); let obj=null;
        if (tag==="path"&&el.getAttribute("d")) obj={ type:"path", d:el.getAttribute("d"), fillRule: paint.fillRule };
        else if (tag==="rect") obj={ type:"rect", x:+el.getAttribute("x")||0, y:+el.getAttribute("y")||0, width:+el.getAttribute("width")||0, height:+el.getAttribute("height")||0 };
        else if (tag==="circle") { const r=+el.getAttribute("r")||0; obj={ type:"ellipse", cx:+el.getAttribute("cx")||0, cy:+el.getAttribute("cy")||0, rx:r, ry:r }; }
        else if (tag==="ellipse") obj={ type:"ellipse", cx:+el.getAttribute("cx")||0, cy:+el.getAttribute("cy")||0, rx:+el.getAttribute("rx")||0, ry:+el.getAttribute("ry")||0 };
        else if (tag==="line") obj={ type:"line", x1:+el.getAttribute("x1")||0, y1:+el.getAttribute("y1")||0, x2:+el.getAttribute("x2")||0, y2:+el.getAttribute("y2")||0 };
        else if (tag==="polygon"||tag==="polyline") { const d=polygonToPath(el.getAttribute("points"), tag==="polygon"); if(d) obj={ type:"path", d, fillRule: paint.fillRule }; }
        else if (tag==="text") obj={ type:"text", x:+el.getAttribute("x")||0, y:+el.getAttribute("y")||0, text: el.textContent||"", fontSize: parseFloat(el.getAttribute("font-size")||28) };
        if (obj) imported.push({ id:uid(), ...obj, fill: obj.type==="line"?"none":paint.fill, stroke:paint.stroke, strokeWidth:paint.strokeWidth, matrix:mat });
        [...el.children].forEach((child)=>walk(child,paint,mat));
      }
      [...root.children].forEach((child)=>walk(child,{fill:"#000",stroke:"none",strokeWidth:0,fillRule:"evenodd"},identity()));
      if (!imported.length) throw new Error("取り込み可能な図形が見つかりませんでした");
      return imported;
    }
    function placeImportedGroup(group) {
      applyView();
      const el = document.getElementById(group.id);
      const r = canvas.getBoundingClientRect();
      if (!el || r.width < 8 || r.height < 8) return;
      const bbox = el.getBBox();
      const vw = r.width / state.zoom;
      const vh = r.height / state.zoom;
      const target = Math.min(vw, vh) * 0.62;
      const scale = target / Math.max(bbox.width || 1, bbox.height || 1, 1);
      const cx = state.panX + vw / 2;
      const cy = state.panY + vh / 2;
      const bx = bbox.x + (bbox.width || 0) / 2;
      const by = bbox.y + (bbox.height || 0) / 2;
      group.matrix = multiply(multiply(mTranslate(cx, cy), mScale(scale, scale)), mTranslate(-bx, -by));
    }
    function afterLayout(fn) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (canvas.getBoundingClientRect().width < 8) setTimeout(fn, 50);
        else fn();
      }));
    }
    function importSvgToCanvas(markup) {
      const imported = parseSvgObjects(markup);
      snapshot();
      const group = { id: uid(), type:"group", children: imported, fill:"none", stroke:"none", strokeWidth:0, matrix: identity() };
      state.objects.push(group);
      showCanvasView();
      applyView();
      renderObjects();
      afterLayout(() => {
        placeImportedGroup(group);
        renderObjects();
        selectIds([group.id]);
        setTool("select");
        drawSelection();
        toast("キャンバス中央に取り込みました");
      });
    }

    document.getElementById("btn-ai").addEventListener("click", showImportView);
    document.getElementById("btn-close-ai").addEventListener("click", showCanvasView);
    document.getElementById("btn-close-ai-2").addEventListener("click", showCanvasView);
    document.querySelectorAll(".import-tabs button").forEach((tab)=>tab.addEventListener("click", ()=>{
      document.querySelectorAll(".import-tabs button").forEach((t)=>t.classList.toggle("active", t===tab));
      document.getElementById("panel-upload").classList.toggle("hidden", tab.dataset.tab!=="upload");
      document.getElementById("panel-generate").classList.toggle("hidden", tab.dataset.tab!=="generate");
    }));
    document.getElementById("file").addEventListener("change", async ()=>{ const file=document.getElementById("file").files?.[0]; if(!file) return; try{ showSource(await fileToDataUrl(file)); }catch(err){ aiStatus(err.message,true); } });
    const dropzone=document.getElementById("dropzone");
    ["dragenter","dragover"].forEach(ev=>dropzone.addEventListener(ev,e=>{ e.preventDefault(); dropzone.classList.add("drag"); }));
    ["dragleave","drop"].forEach(ev=>dropzone.addEventListener(ev,e=>{ e.preventDefault(); dropzone.classList.remove("drag"); }));
    dropzone.addEventListener("drop", async e=>{ const file=e.dataTransfer.files?.[0]; if(!file||!file.type.startsWith("image/")) return aiStatus("画像ファイルをドロップしてください",true); try{ showSource(await fileToDataUrl(file)); }catch(err){ aiStatus(err.message,true); } });
    document.querySelectorAll(".ex").forEach(btn=>btn.addEventListener("click", ()=>{ document.getElementById("prompt").value=btn.dataset.prompt; }));
    function setAiBusy(on,label){ ai.busy=on; const convert=document.getElementById("btn-convert"); const gen=document.getElementById("btn-generate"); convert.disabled=on||!ai.sourceDataUrl; gen.disabled=on; convert.innerHTML=on?`<span class="spinner"></span>${label||"処理中"}`:"トレースしてキャンバスへ"; }
    document.getElementById("btn-generate").addEventListener("click", async ()=>{
      const prompt=document.getElementById("prompt").value.trim(); if(!prompt) return aiStatus("プロンプトを入力してください",true);
      setAiBusy(true,"画像を生成中..."); aiStatus("画像を生成しています...");
      try{ showSource(await loadGeneratedImage(prompt)); aiStatus("生成しました。続けてトレースできます"); }catch(err){ aiStatus(err.message||"画像生成に失敗しました",true); } finally{ setAiBusy(false); }
    });
    document.getElementById("btn-convert").addEventListener("click", async ()=>{
      if(!ai.sourceDataUrl) return aiStatus("先に画像を用意してください",true);
      setAiBusy(true,"トレースボットで変換中...");
      try{
        const svg=await traceBitmapToSvg(ai.sourceDataUrl);
        ai.svgMarkup=svg;
        showSvgPreview(svg);
        importSvgToCanvas(svg);
      }catch(err){ aiStatus(err.message||"変換に失敗しました",true); } finally{ setAiBusy(false); }
    });
  </script>
