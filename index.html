<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scratch SVG Paint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=DotGothic16&family=Fredoka:wght@600&family=Hachi+Maru+Pop&family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@500;700&family=Pacifico&family=Rampart+One&family=Reggae+One&family=RocknRoll+One&family=Stick&family=Yusei+Magic&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #855cd6;
      --purple-soft: #e9d9f7;
      --fill: #cf63cf;
      --bg: #d9e3ea;
      --panel: #f2f7fb;
      --line: #c2d0db;
      --text: #575e75;
      --ink: #222;
      --tool: 42px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Helvetica Neue", "Segoe UI", sans-serif; user-select: none; }
    button, input, select { font-family: inherit; }
    .app { height: 100%; display: grid; grid-template-rows: 48px 1fr 42px; }
    .topbar {
      display: flex; align-items: center; gap: 8px; padding: 0 10px;
      background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto;
    }
    .name-wrap { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
    .name-wrap input { width: 110px; height: 28px; border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; }
    .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: 0 0 auto; }
    .ibtn {
      width: 32px; height: 32px; border: 0; background: transparent; border-radius: 4px; cursor: pointer;
      color: var(--text); display: grid; place-items: center;
    }
    .ibtn:hover { background: #e6eef5; }
    .ibtn:disabled { opacity: .35; cursor: default; }
    .ibtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .color-field { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
    .swatch { position: relative; width: 28px; height: 28px; flex: 0 0 auto; border: 0; padding: 0; background: transparent; cursor: pointer; }
    .chip { width: 100%; height: 100%; border-radius: 6px; border: 1px solid #9aaebb; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); display: block; }
    .none .chip { background: linear-gradient(135deg, transparent 46%, #d0021b 46% 54%, transparent 54%), #fff !important; }
    .color-pop {
      position: fixed; z-index: 80; width: 168px; background: #fff; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 10px; color: #575e75; font-size: 12px;
    }
    .fill-modes { display: flex; gap: 6px; justify-content: space-between; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid #e6edf2; }
    .fill-modes button {
      width: 32px; height: 32px; border-radius: 6px; border: 1px solid #c2d0db; padding: 0; cursor: pointer; background: #fff;
    }
    .fill-modes button.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #4c97ff; }
    .slider-block { margin: 8px 0 10px; }
    .slider-lab { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .color-pop input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 8px;
      border: 1px solid #c2d0db; outline: none; background: #ddd;
    }
    .color-pop input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; border: 1px solid #b9c4ce; box-shadow: 0 1px 2px rgba(0,0,0,.2); cursor: pointer;
    }
    .pop-foot { display: flex; justify-content: space-between; margin-top: 4px; }
    .pop-foot button {
      width: 32px; height: 32px; border-radius: 6px; border: 1px solid #c2d0db; background: #fff; cursor: pointer;
      display: grid; place-items: center; padding: 0;
    }
    .pop-foot svg { width: 18px; height: 18px; }
    svg.canvas.eyedrop { cursor: crosshair; }
    .width-num { width: 42px; height: 26px; border: 1px solid var(--line); border-radius: 4px; text-align: center; }
    .font-select {
      height: 26px; max-width: 148px; border: 1px solid var(--line); border-radius: 4px;
      background: #fff; color: var(--ink); font-size: 12px; padding: 0 4px;
    }
    .grow { flex: 1; }
    .ai-btn, .save-btn {
      height: 30px; padding: 0 10px; border: 0; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 700;
    }
    .ai-btn { background: #ffbf00; color: #111; }
    .save-btn { background: var(--purple); color: #fff; }

    .workspace { display: grid; grid-template-columns: 58px 1fr; min-height: 0; }
    .toolbar {
      background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;
    }
    .tool {
      width: var(--tool); height: var(--tool); border: 0; background: transparent; border-radius: 8px;
      color: var(--text); cursor: pointer; display: grid; place-items: center; position: relative;
    }
    .tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tool:hover { background: #e6eef5; }
    .tool.active { background: var(--purple); color: #fff; }
    .hint {
      position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
      background: #111; color: #fff; font-size: 11px; padding: 4px 6px; border-radius: 4px; white-space: nowrap;
      pointer-events: none; opacity: 0; z-index: 20;
    }
    .tool:hover .hint { opacity: 1; }

    .stage { min-width: 0; min-height: 0; position: relative; background: #c8d4de; }
    .paper {
      position: absolute; inset: 0; overflow: hidden;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #eceff4 25%, transparent 25%),
        linear-gradient(-45deg, #eceff4 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eceff4 75%),
        linear-gradient(-45deg, transparent 75%, #eceff4 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    svg.canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    svg.canvas.select, svg.canvas.reshape, svg.canvas.fill { cursor: default; }
    svg.canvas.eraser { cursor: cell; }
    svg.canvas.text { cursor: text; }

    .bottombar {
      display: flex; align-items: center; justify-content: flex-end; gap: 6px;
      padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line);
    }
    .zoom-btn {
      width: 34px; height: 28px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; color: var(--text);
    }
    .zoom-label { min-width: 48px; text-align: center; font-size: 12px; }

    .toast {
      position: fixed; right: 16px; bottom: 52px; background: #333; color: #fff; padding: 8px 12px; border-radius: 8px;
      font-size: 13px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .25s; z-index: 50;
    }
    .toast.show { opacity: 1; transform: none; }

    .import-view { display: none; min-height: 100%; background: var(--bg); }
    body.import-open { overflow: auto; }
    body.import-open .app { display: none; }
    body.import-open .import-view { display: block; }
    .import-bar { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .import-bar .back-btn, .import-actions .back-btn {
      background: #575e75;
      color: #fff;
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .import-wrap { width: min(860px, calc(100% - 32px)); margin: 24px auto 48px; background: #fff; border-radius: 12px; padding: 22px; }
    .import-wrap h2 { color: var(--ink); margin-bottom: 6px; }
    .import-wrap .lead, .import-wrap label { color: #667; font-size: 13px; margin-bottom: 10px; }
    .import-wrap label { display: grid; gap: 6px; }
    .import-wrap input, .import-wrap textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; }
    .import-wrap textarea { min-height: 72px; }
    .key-row, .import-actions, .import-tabs, .examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .key-row input { flex: 1; }
    .import-tabs button, .ghost, .go, .ex { border: 1px solid var(--line); background: #f4f7fb; height: 34px; padding: 0 12px; border-radius: 8px; cursor: pointer; }
    .import-tabs button.active, .go { background: var(--purple); color: #fff; border-color: transparent; }
    .go { height: 42px; font-weight: 700; }
    .go:disabled { opacity: .4; }
    .drop { border: 1.5px dashed var(--line); border-radius: 12px; min-height: 140px; display: grid; place-items: center; background: #f7fafc; cursor: pointer; }
    .drop.drag { border-color: var(--purple); background: var(--purple-soft); }
    .drop input { display: none; }
    .preview-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pv { border: 1px solid var(--line); border-radius: 10px; min-height: 180px; display: grid; place-items: center; background: #fafafa; overflow: hidden; }
    .pv img, .pv svg { max-width: 100%; max-height: 200px; }
    .import-status { font-size: 13px; min-height: 18px; margin: 10px 0; }
    .import-status.err { color: #d0021b; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #selection-ui { pointer-events: none; }
    svg.canvas.select #selection-ui .handle, svg.canvas.select #selection-ui .rot-handle,
    svg.canvas.reshape #selection-ui .node,
    svg.canvas.reshape #selection-ui .mid { pointer-events: auto; cursor: pointer; }
    svg.canvas.reshape #selection-ui .mid { cursor: copy; }
    .hidden { display: none !important; }
    @media (max-width: 640px) { .preview-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <label class="name-wrap">コスチューム <input id="costume-name" value="costume1" /></label>
      <div class="sep"></div>
      <button class="ibtn" id="btn-undo" title="元に戻す" disabled><svg viewBox="0 0 24 24"><path d="M9 7H5V3"/><path d="M5 7a8 8 0 1 1-1.3 6.2"/></svg></button>
      <button class="ibtn" id="btn-redo" title="やり直す" disabled><svg viewBox="0 0 24 24"><path d="M15 7h4V3"/><path d="M19 7a8 8 0 1 0 1.3 6.2"/></svg></button>
      <div class="sep"></div>
      <button class="ibtn" id="btn-group" title="グループ化"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="10" height="8"/><rect x="10" y="11" width="10" height="8"/></svg></button>
      <button class="ibtn" id="btn-ungroup" title="グループ解除"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="8" height="7"/><rect x="13" y="11" width="8" height="7"/></svg></button>
      <button class="ibtn" id="btn-clean-junk" title="周りのゴミを消す"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="1.15" fill="currentColor" stroke="none"/><circle cx="10.5" cy="5.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="8" cy="11" r="0.8" fill="currentColor" stroke="none"/><path d="M14 6l2.2 2.2L9 15.4 6.8 13.2z"/><path d="M16.6 8.6l1.8 1.8-2.1 2.1-1.8-1.8z"/><path d="M6.2 13.8L5 19l5.2-1.2"/></svg></button>
      <div class="sep"></div>
      <button class="ibtn" id="btn-forward" title="ひとつ前面へ"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button>
      <button class="ibtn" id="btn-backward" title="ひとつ背面へ"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg></button>
      <button class="ibtn" id="btn-front" title="最前面へ"><svg viewBox="0 0 24 24"><rect x="7" y="8" width="11" height="10"/><rect x="4" y="4" width="11" height="10"/></svg></button>
      <button class="ibtn" id="btn-back" title="最背面へ"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="11" height="10"/><rect x="7" y="8" width="11" height="10"/></svg></button>
      <div class="sep"></div>
      <div class="color-field">塗りつぶし
        <button class="swatch" id="fill-wrap" type="button" title="塗りつぶしの色"><span id="fill-chip" class="chip" style="background:#cf63cf"></span></button>
        <button class="ibtn" id="btn-no-fill" title="塗りなし"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6 18L18 6"/></svg></button>
      </div>
      <div class="color-field">枠線
        <button class="swatch" id="stroke-wrap" type="button" title="枠線の色"><span id="stroke-chip" class="chip" style="background:#111111"></span></button>
        <input class="width-num" id="stroke-width" type="number" min="0" max="80" value="4" />
      </div>
      <div class="sep"></div>
      <div class="color-field">フォント
        <select class="font-select" id="font-family">
          <option value="Noto Sans JP, Yu Gothic, Meiryo, sans-serif" style="font-family:Noto Sans JP,sans-serif">ゴシック</option>
          <option value="Noto Serif JP, Yu Mincho, serif" style="font-family:Noto Serif JP,serif">明朝</option>
          <option value="M PLUS Rounded 1c, Yu Gothic, sans-serif" style="font-family:M PLUS Rounded 1c,sans-serif">丸ゴシック</option>
          <option value="Kosugi Maru, Yu Gothic, sans-serif" style="font-family:Kosugi Maru,sans-serif">こすぎ丸</option>
          <option value="Hachi Maru Pop, Yu Gothic, cursive" style="font-family:Hachi Maru Pop,cursive">はちまるポップ</option>
          <option value="Yusei Magic, Yu Gothic, sans-serif" style="font-family:Yusei Magic,sans-serif">マジック</option>
          <option value="Reggae One, Yu Gothic, cursive" style="font-family:Reggae One,cursive">レゲエ</option>
          <option value="Dela Gothic One, Impact, sans-serif" style="font-family:Dela Gothic One,sans-serif">デラゴシック</option>
          <option value="DotGothic16, MS Gothic, monospace" style="font-family:DotGothic16,monospace">ドット</option>
          <option value="Rampart One, Impact, sans-serif" style="font-family:Rampart One,sans-serif">ランパート</option>
          <option value="RocknRoll One, Yu Gothic, sans-serif" style="font-family:RocknRoll One,sans-serif">ロックンロール</option>
          <option value="Stick, Yu Gothic, sans-serif" style="font-family:Stick,sans-serif">スティック</option>
          <option value="Arial, Helvetica, sans-serif" style="font-family:Arial,sans-serif">Arial</option>
          <option value="Verdana, Geneva, sans-serif" style="font-family:Verdana,sans-serif">Verdana</option>
          <option value="Georgia, serif" style="font-family:Georgia,serif">Georgia</option>
          <option value="Times New Roman, Times, serif" style="font-family:Times New Roman,serif">Times</option>
          <option value="Courier New, Courier, monospace" style="font-family:Courier New,monospace">Courier</option>
          <option value="Comic Sans MS, Comic Sans, cursive" style="font-family:Comic Sans MS,cursive">Comic Sans</option>
          <option value="Impact, Haettenschweiler, sans-serif" style="font-family:Impact,sans-serif">Impact</option>
          <option value="Pacifico, cursive" style="font-family:Pacifico,cursive">Pacifico</option>
          <option value="Bangers, Impact, cursive" style="font-family:Bangers,cursive">Bangers</option>
          <option value="Fredoka, Arial Rounded MT Bold, sans-serif" style="font-family:Fredoka,sans-serif">Fredoka</option>
        </select>
        <input class="width-num" id="font-size" type="number" min="8" max="240" value="28" title="サイズ" />
      </div>
      <div class="sep"></div>
      <button class="ibtn" id="btn-copy" title="コピー"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/></svg></button>
      <button class="ibtn" id="btn-paste" title="貼り付け"><svg viewBox="0 0 24 24"><path d="M8 8h11v12H8z"/><path d="M5 16V4h10"/></svg></button>
      <button class="ibtn" id="btn-delete" title="削除"><svg viewBox="0 0 24 24"><path d="M6 8h12"/><path d="M9 8V6h6v2"/><path d="M8 8l1 12h6l1-12"/></svg></button>
      <div class="sep"></div>
      <button class="ibtn" id="btn-flip-h" title="左右反転"><svg viewBox="0 0 24 24"><path d="M12 4v16"/><path d="M5 8l7 4-7 4z"/><path d="M19 8l-7 4 7 4z"/></svg></button>
      <button class="ibtn" id="btn-flip-v" title="上下反転"><svg viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M8 5l4 7-4 7"/><path d="M16 5l-4 7 4 7"/></svg></button>
      <div class="grow"></div>
      <button class="ai-btn" id="btn-ai" type="button">画像から取込</button>
      <button class="save-btn" id="btn-export" type="button">SVG保存</button>
    </header>

    <div class="workspace">
      <aside class="toolbar">
        <button class="tool active" data-tool="select"><svg viewBox="0 0 24 24"><path d="M5 4l6 16 2.2-6.2L19.5 12z"/></svg><span class="hint">選択</span></button>
        <button class="tool" data-tool="reshape"><svg viewBox="0 0 24 24"><path d="M5 5l8 14 1.5-6L21 11z"/><circle cx="18" cy="18" r="2.2" fill="currentColor" stroke="none"/></svg><span class="hint">再変形</span></button>
        <button class="tool" data-tool="pen"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg><span class="hint">筆</span></button>
        <button class="tool" data-tool="eraser"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7-4 4H9z"/></svg><span class="hint">消しゴム</span></button>
        <button class="tool" data-tool="fill"><svg viewBox="0 0 24 24"><path d="M7 14l6-8 6 8H7z"/><path d="M8 17h8"/></svg><span class="hint">塗りつぶし</span></button>
        <button class="tool" data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6h14"/><path d="M12 6v14"/><path d="M8 20h8"/></svg><span class="hint">テキスト</span></button>
        <button class="tool" data-tool="line"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg><span class="hint">直線</span></button>
        <button class="tool" data-tool="ellipse"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><span class="hint">円</span></button>
        <button class="tool" data-tool="rect"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12"/></svg><span class="hint">四角形</span></button>
      </aside>
      <main class="stage">
        <div class="paper">
          <svg class="canvas select" id="canvas" xmlns="http://www.w3.org/2000/svg">
            <defs id="paint-defs"></defs>
            <g id="objects"></g>
            <g id="preview"></g>
            <g id="selection-ui"></g>
          </svg>
        </div>
      </main>
    </div>

    <footer class="bottombar">
      <button class="zoom-btn" id="zoom-out" title="縮小">−</button>
      <button class="zoom-btn" id="zoom-reset" title="100%">=</button>
      <button class="zoom-btn" id="zoom-in" title="拡大">+</button>
      <div class="zoom-label" id="zoom-label">100%</div>
    </footer>
  </div>
  <div class="toast" id="toast"></div>
  <div class="color-pop hidden" id="color-pop">
    <div class="fill-modes" id="fill-modes">
      <button type="button" data-mode="solid" title="単色"></button>
      <button type="button" data-mode="linear" title="線形グラデーション"></button>
      <button type="button" data-mode="radial" title="円形グラデーション"></button>
      <button type="button" data-mode="soft" title="やわらかい円形"></button>
    </div>
    <div class="slider-block">
      <div class="slider-lab"><span>色</span><span id="hsv-h-val">0</span></div>
      <input id="hsv-h" type="range" min="0" max="100" value="83" />
    </div>
    <div class="slider-block">
      <div class="slider-lab"><span>鮮やかさ</span><span id="hsv-s-val">60</span></div>
      <input id="hsv-s" type="range" min="0" max="100" value="60" />
    </div>
    <div class="slider-block">
      <div class="slider-lab"><span>明るさ</span><span id="hsv-v-val">100</span></div>
      <input id="hsv-v" type="range" min="0" max="100" value="100" />
    </div>
    <div class="pop-foot">
      <button type="button" id="pop-none" title="塗りなし">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#c2d0db"/><path d="M5 19L19 5" stroke="#ff8c1a" stroke-width="2"/></svg>
      </button>
      <button type="button" id="pop-eyedrop" title="スポイト">
        <svg viewBox="0 0 24 24" fill="none" stroke="#575e75" stroke-width="1.8" stroke-linecap="round"><path d="M14 4l6 6"/><path d="M13 7l4 4"/><path d="M14 10L7 17l-2 2-1-1 2-2 7-7z"/></svg>
      </button>
    </div>
  </div>

  <div class="import-view" id="view-import">
    <header class="import-bar">
      <strong>画像から取込</strong>
      <button class="back-btn" id="btn-close-ai" type="button">キャンバスへ戻る</button>
    </header>
    <div class="import-wrap">
      <h2>画像からキャンバスへ</h2>
      <p class="lead">トレースボットが色面をたどってSVGにします。本体から離れた細かいゴミは自動で捨てます。変換後はキャンバス中央に置かれ、選択して動かせます。</p>
      <div class="import-tabs">
        <button type="button" class="active" data-tab="upload">画像をアップロード</button>
        <button type="button" data-tab="generate">AIで画像を生成</button>
      </div>
      <div id="panel-upload">
        <label class="drop" id="dropzone"><input id="file" type="file" accept="image/png,image/jpeg,image/jpg,image/webp" />PNG / JPG をドロップ、またはクリック</label>

        <label>プロンプト<textarea id="prompt" placeholder="simple cute cat icon, flat design, white background"></textarea></label>
        <div class="examples">
          <button type="button" class="ex" data-prompt="simple cute cat icon, flat design, vector style, white background">かわいい猫</button>
          <button type="button" class="ex" data-prompt="simple red apple icon, flat design, bold shapes, white background">りんご</button>
          <button type="button" class="ex" data-prompt="minimal mountain landscape logo, geometric, flat colors">山のロゴ</button>
        </div>
        <button class="go" id="btn-generate" type="button">画像を生成</button>
      </div>
      <div class="preview-row">
        <div><div class="lead">元画像</div><div class="pv" id="source-frame">未選択</div></div>
        <div><div class="lead">変換プレビュー</div><div class="pv" id="svg-frame">まだありません</div></div>
      </div>
      <div class="import-status" id="ai-status">画像を用意してから変換してください</div>
      <div class="import-actions">
        <button class="go" id="btn-convert" type="button" disabled>トレースしてキャンバスへ</button>
        <button class="back-btn" id="btn-close-ai-2" type="button">キャンバスへ戻る</button>
      </div>
    </div>
  </div>

  <script src="config.local.js"></script>
  <script>
    const svgNS = "http://www.w3.org/2000/svg";
    const canvas = document.getElementById("canvas");
    const defsLayer = document.getElementById("paint-defs");
    const objectsLayer = document.getElementById("objects");
    const previewLayer = document.getElementById("preview");
    const selectionLayer = document.getElementById("selection-ui");
    const HANDLE_POS = { nw:[0,0], n:[.5,0], ne:[1,0], e:[1,.5], se:[1,1], s:[.5,1], sw:[0,1], w:[0,.5] };

    const state = {
      tool: "select",
      fill: "#cf63cf",
      fill2: "#ffffff",
      fillStyle: "solid",
      fillNone: false,
      stroke: "#111111",
      stroke2: "#ffffff",
      strokeStyle: "solid",
      strokeNone: false,
      strokeWidth: 4,
      hsv: { h: 83, s: 52, v: 81 },
      colorTarget: "fill",
      eyedrop: null,
      objects: [],
      selectedIds: [],
      history: [],
      future: [],
      clipboard: [],
      drawing: null,
      gesture: null,
      applyingUI: false,
      zoom: 1,
      panX: 0,
      panY: 0,
      fontFamily: "Noto Sans JP, Yu Gothic, Meiryo, sans-serif",
      fontSize: 28,
    };

    const uid = () => "o" + Math.random().toString(36).slice(2, 10);
    const identity = () => [1, 0, 0, 1, 0, 0];
    const clone = (v) => JSON.parse(JSON.stringify(v));
    const currentFill = () => (state.fillNone ? "none" : state.fill);
    const currentStroke = () => (state.strokeNone ? "none" : state.stroke);
    const selectedObjects = () => state.objects.filter((o) => state.selectedIds.includes(o.id));
    const selected = () => selectedObjects()[0] || null;

    function hsvToHex(h, s, v) {
      h = ((h % 100) + 100) % 100 / 100 * 6;
      s = Math.max(0, Math.min(1, s / 100));
      v = Math.max(0, Math.min(1, v / 100));
      const i = Math.floor(h), f = h - i;
      const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
      const rgb = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i % 6];
      return "#" + rgb.map((x) => Math.round(x * 255).toString(16).padStart(2, "0")).join("");
    }
    function hexToHsv(hex) {
      const h = toHex(hex);
      const r = parseInt(h.slice(1,3),16)/255, g = parseInt(h.slice(3,5),16)/255, b = parseInt(h.slice(5,7),16)/255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
      let hue = 0;
      if (d) {
        if (max === r) hue = ((g - b) / d) % 6;
        else if (max === g) hue = (b - r) / d + 2;
        else hue = (r - g) / d + 4;
        hue /= 6; if (hue < 0) hue += 1;
      }
      return { h: Math.round(hue * 100), s: Math.round(max ? (d / max) * 100 : 0), v: Math.round(max * 100) };
    }
    function gradientCss(style, c1, c2) {
      const a = c1 || "#888", b = c2 || "#fff";
      if (style === "linear") return `linear-gradient(90deg, ${a}, ${b})`;
      if (style === "radial") return `radial-gradient(circle at 50% 50%, ${a} 0%, ${b} 70%)`;
      if (style === "soft") return `radial-gradient(circle at 50% 50%, ${a} 0%, ${a} 18%, ${b} 78%)`;
      return a;
    }
    function isGrad(style) { return style && style !== "solid"; }
    function paintFor(obj, kind) {
      const color = kind === "stroke" ? obj.stroke : obj.fill;
      const style = kind === "stroke" ? (obj.strokeStyle || "solid") : (obj.fillStyle || "solid");
      if (!color || color === "none") return "none";
      if (!isGrad(style)) return color;
      return `url(#g-${kind}-${obj.id})`;
    }
    function makeGradient(id, style, c1, c2) {
      const a = c1 || "#888", b = c2 || "#ffffff";
      let g;
      if (style === "linear") {
        g = createEl("linearGradient", { id, x1:"0", y1:"0", x2:"1", y2:"0", gradientUnits:"objectBoundingBox" });
        g.append(createEl("stop", { offset:"0%", "stop-color": a }), createEl("stop", { offset:"100%", "stop-color": b }));
      } else if (style === "radial") {
        g = createEl("radialGradient", { id, cx:"0.5", cy:"0.5", r:"0.55", gradientUnits:"objectBoundingBox" });
        g.append(createEl("stop", { offset:"0%", "stop-color": a }), createEl("stop", { offset:"100%", "stop-color": b }));
      } else {
        g = createEl("radialGradient", { id, cx:"0.5", cy:"0.5", r:"0.85", fx:"0.5", fy:"0.5", gradientUnits:"objectBoundingBox" });
        g.append(createEl("stop", { offset:"0%", "stop-color": a }), createEl("stop", { offset:"35%", "stop-color": a }), createEl("stop", { offset:"100%", "stop-color": b }));
      }
      return g;
    }
    function collectGradients(obj) {
      if (obj.type === "group") { (obj.children || []).forEach(collectGradients); return; }
      if (isGrad(obj.fillStyle) && obj.fill && obj.fill !== "none") defsLayer.append(makeGradient(`g-fill-${obj.id}`, obj.fillStyle, obj.fill, obj.fill2));
      if (isGrad(obj.strokeStyle) && obj.stroke && obj.stroke !== "none") defsLayer.append(makeGradient(`g-stroke-${obj.id}`, obj.strokeStyle, obj.stroke, obj.stroke2));
    }
    function applyFillOnly(obj) {
      if (!obj || obj.type === "line") return;
      obj.fill = currentFill();
      obj.fillStyle = state.fillNone ? "solid" : state.fillStyle;
      obj.fill2 = state.fill2;
    }
    function applyCurrentPaint(obj) {
      if (obj.type !== "line") {
        obj.fill = currentFill();
        obj.fillStyle = state.fillNone ? "solid" : state.fillStyle;
        obj.fill2 = state.fill2;
      }
      obj.stroke = currentStroke();
      obj.strokeStyle = state.strokeNone ? "solid" : state.strokeStyle;
      obj.stroke2 = state.stroke2;
      obj.strokeWidth = state.strokeWidth;
    }

    function multiply(a, b) {
      return [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
    }
    function invert(m) {
      const [a,b,c,d,e,f] = m, det = a*d - c*b;
      if (Math.abs(det) < 1e-8) return identity();
      return [d/det, -b/det, -c/det, a/det, (c*f-d*e)/det, (b*e-a*f)/det];
    }
    function applyMat(m, x, y) { return { x: m[0]*x + m[2]*y + m[4], y: m[1]*x + m[3]*y + m[5] }; }
    function mTranslate(tx, ty) { return [1,0,0,1,tx,ty]; }
    function mScale(sx, sy) { return [sx,0,0,sy,0,0]; }
    function mRotate(rad) { const c=Math.cos(rad), s=Math.sin(rad); return [c,s,-s,c,0,0]; }
    function svgPoint(evt) {
      const pt = canvas.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      return pt.matrixTransform(canvas.getScreenCTM().inverse());
    }
    function createEl(name, attrs={}) {
      const el = document.createElementNS(svgNS, name);
      for (const [k,v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
      return el;
    }
    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text; el.classList.add("show");
      clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }
    function applyView() {
      const r = canvas.getBoundingClientRect();
      const w = Math.max(1, r.width / state.zoom);
      const h = Math.max(1, r.height / state.zoom);
      canvas.setAttribute("viewBox", `${state.panX} ${state.panY} ${w} ${h}`);
      document.getElementById("zoom-label").textContent = Math.round(state.zoom * 100) + "%";
    }

    function snapshot() {
      state.history.push({ objects: clone(state.objects), selectedIds: state.selectedIds.slice() });
      if (state.history.length > 80) state.history.shift();
      state.future = [];
      refreshHistoryButtons();
    }
    function undo() {
      if (!state.history.length) return;
      state.future.push({ objects: clone(state.objects), selectedIds: state.selectedIds.slice() });
      const prev = state.history.pop();
      state.objects = clone(prev.objects);
      state.selectedIds = prev.selectedIds || [];
      renderObjects(); syncSelectionUI(); refreshHistoryButtons();
    }
    function redo() {
      if (!state.future.length) return;
      state.history.push({ objects: clone(state.objects), selectedIds: state.selectedIds.slice() });
      const next = state.future.pop();
      state.objects = clone(next.objects);
      state.selectedIds = next.selectedIds || [];
      renderObjects(); syncSelectionUI(); refreshHistoryButtons();
    }
    function refreshHistoryButtons() {
      document.getElementById("btn-undo").disabled = !state.history.length;
      document.getElementById("btn-redo").disabled = !state.future.length;
    }

    function localBBox(obj) {
      if (obj.type === "group") {
        const el = document.getElementById(obj.id);
        if (el) { const b = el.getBBox(); return { x:b.x, y:b.y, w:b.width||1, h:b.height||1 }; }
        return { x:0,y:0,w:1,h:1 };
      }
      if (obj.type === "rect") return { x:obj.x, y:obj.y, w:obj.width, h:obj.height };
      if (obj.type === "ellipse") return { x:obj.cx-obj.rx, y:obj.cy-obj.ry, w:obj.rx*2, h:obj.ry*2 };
      if (obj.type === "text") {
        const s = measureText(obj);
        return { x:obj.x, y:obj.y-obj.fontSize, w: s.w, h: s.h };
      }
      if (obj.type === "line") {
        const x = Math.min(obj.x1,obj.x2), y = Math.min(obj.y1,obj.y2);
        return { x, y, w: Math.abs(obj.x2-obj.x1)||1, h: Math.abs(obj.y2-obj.y1)||1 };
      }
      const el = document.getElementById(obj.id)?.querySelector(".shape");
      if (el) { const b = el.getBBox(); return { x:b.x, y:b.y, w:b.width||1, h:b.height||1 }; }
      return { x:0,y:0,w:1,h:1 };
    }
    function worldCorners(obj) {
      const b = localBBox(obj);
      return [[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]].map(([x,y]) => applyMat(obj.matrix, x, y));
    }
    function unionBox(objs) {
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
      objs.forEach((o) => worldCorners(o).forEach((p) => {
        minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
      }));
      if (!isFinite(minX)) return { x:0,y:0,w:1,h:1 };
      return { x:minX, y:minY, w:maxX-minX||1, h:maxY-minY||1 };
    }

    function shapeNode(obj) {
      const common = { class:"shape", fill: paintFor(obj, "fill"), stroke: paintFor(obj, "stroke"), "stroke-width":obj.strokeWidth, "stroke-linecap":"round", "stroke-linejoin":"round" };
      if (obj.type === "path") return createEl("path", { ...common, d: obj.d, "fill-rule": obj.fillRule || "evenodd" });
      if (obj.type === "rect") return createEl("rect", { ...common, x:obj.x, y:obj.y, width:obj.width, height:obj.height });
      if (obj.type === "ellipse") return createEl("ellipse", { ...common, cx:obj.cx, cy:obj.cy, rx:obj.rx, ry:obj.ry });
      if (obj.type === "text") return createEl("text", { ...common, x:obj.x, y:obj.y, "font-size":obj.fontSize, "font-family": obj.fontFamily || "sans-serif" });
      return createEl("line", { ...common, x1:obj.x1, y1:obj.y1, x2:obj.x2, y2:obj.y2, fill:"none" });
    }
    function hitNode(obj) {
      const hitWidth = Math.max(14, (obj.strokeWidth||0)+10);
      const filled = obj.fill && obj.fill !== "none";
      if (obj.type === "path") return createEl("path", { d:obj.d, fill: filled?"transparent":"none", stroke:"transparent", "stroke-width":hitWidth, class:"hit", "fill-rule": obj.fillRule || "evenodd", "pointer-events": filled?"all":"stroke" });
      if (obj.type === "rect") return createEl("rect", { x:obj.x, y:obj.y, width:obj.width, height:obj.height, fill:"transparent", class:"hit", "pointer-events":"all" });
      if (obj.type === "ellipse") return createEl("ellipse", { cx:obj.cx, cy:obj.cy, rx:obj.rx, ry:obj.ry, fill:"transparent", class:"hit", "pointer-events":"all" });
      if (obj.type === "text") {
        const s = measureText(obj);
        return createEl("rect", { x:obj.x, y:obj.y-obj.fontSize, width:s.w, height:s.h, fill:"transparent", class:"hit", "pointer-events":"all" });
      }
      return createEl("line", { x1:obj.x1, y1:obj.y1, x2:obj.x2, y2:obj.y2, stroke:"transparent", "stroke-width":hitWidth, class:"hit", "pointer-events":"stroke" });
    }
    function renderOne(obj) {
      const g = createEl("g", { id: obj.id, class: "drawable", transform: `matrix(${obj.matrix.join(" ")})` });
      if (obj.type === "group") {
        obj.children.forEach((ch) => g.append(renderOne(ch)));
      } else {
        g.append(hitNode(obj), shapeNode(obj));
        if (obj.type === "text") g.querySelector(".shape").textContent = obj.text || "";
      }
      return g;
    }
    function renderObjects() {
      defsLayer.replaceChildren();
      objectsLayer.replaceChildren();
      state.objects.forEach((obj) => collectGradients(obj));
      state.objects.forEach((obj) => objectsLayer.append(renderOne(obj)));
    }

    function measureText(obj) {
      const ctx = measureText._c || (measureText._c = document.createElement("canvas").getContext("2d"));
      ctx.font = `${obj.fontSize || 28}px ${obj.fontFamily || "sans-serif"}`;
      return { w: Math.max(20, ctx.measureText(obj.text || "").width), h: (obj.fontSize || 28) * 1.3 };
    }
    function updateFontUI() {
      const sel = document.getElementById("font-family");
      const size = document.getElementById("font-size");
      if ([...sel.options].some((o) => o.value === state.fontFamily)) sel.value = state.fontFamily;
      size.value = state.fontSize;
    }
    function applyFontToSelected() {
      if (state.applyingUI) return;
      const apply = (obj) => {
        if (obj.type === "text") { obj.fontFamily = state.fontFamily; obj.fontSize = state.fontSize; }
        if (obj.type === "group" && obj.children) obj.children.forEach(apply);
      };
      if (selectedObjects().length) {
        selectedObjects().forEach(apply);
        renderObjects(); drawSelection();
      }
    }
    function toHex(color) {
      if (!color || color === "none") return "#000000";
      if (color.startsWith("#") && color.length === 7) return color;
      const ctx = toHex._c || (toHex._c = document.createElement("canvas").getContext("2d"));
      ctx.fillStyle = "#000"; ctx.fillStyle = color;
      return ctx.fillStyle.length === 7 ? ctx.fillStyle : "#000000";
    }
    function updateChips() {
      const fillChip = document.getElementById("fill-chip");
      if (state.fillNone) {
        fillChip.style.background = "";
      } else {
        fillChip.style.background = gradientCss(state.fillStyle, state.fill, state.fill2);
      }
      document.getElementById("fill-wrap").classList.toggle("none", state.fillNone);
      const strokeChip = document.getElementById("stroke-chip");
      if (state.strokeNone) {
        strokeChip.style.background = "";
        document.getElementById("stroke-wrap").classList.add("none");
      } else {
        strokeChip.style.background = gradientCss(state.strokeStyle, state.stroke, state.stroke2);
        document.getElementById("stroke-wrap").classList.remove("none");
      }
      document.getElementById("stroke-width").value = state.strokeWidth;
    }
    function styleTargets() {
      return selectedObjects().filter((o) => o.type !== "group");
    }
    function applyStyleToSelected() {
      if (state.applyingUI) return;
      const objs = styleTargets();
      if (!objs.length) return;
      objs.forEach(applyCurrentPaint);
      renderObjects(); drawSelection();
    }
    function loadPropertiesFrom(obj) {
      if (!obj || obj.type === "group") return;
      state.applyingUI = true;
      if (obj.stroke === "none") state.strokeNone = true;
      else { state.strokeNone = false; state.stroke = obj.stroke; state.strokeStyle = obj.strokeStyle || "solid"; if (obj.stroke2) state.stroke2 = obj.stroke2; }
      state.strokeWidth = obj.strokeWidth;
      if (obj.fill === "none") state.fillNone = true;
      else {
        state.fillNone = false;
        if (obj.fill && !String(obj.fill).startsWith("url")) state.fill = obj.fill;
        state.fillStyle = obj.fillStyle || "solid";
        if (obj.fill2) state.fill2 = obj.fill2;
      }
      if (obj.type === "text") {
        if (obj.fontFamily) state.fontFamily = obj.fontFamily;
        if (obj.fontSize) state.fontSize = obj.fontSize;
        updateFontUI();
      }
      updateChips();
      state.applyingUI = false;
    }
    function refreshSelectionButtons() {
      const on = state.selectedIds.length > 0;
      ["btn-front","btn-back","btn-forward","btn-backward","btn-delete","btn-copy","btn-flip-h","btn-flip-v","btn-group","btn-ungroup","btn-clean-junk"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.disabled = !on;
      });
      document.getElementById("btn-group").disabled = state.selectedIds.length < 2;
      document.getElementById("btn-ungroup").disabled = !selectedObjects().some(canUngroup);
    }

    function selectIds(ids, additive) {
      state.selectedIds = additive ? Array.from(new Set(state.selectedIds.concat(ids))) : ids.slice();
      const obj = selected();
      if (obj) loadPropertiesFrom(obj);
      refreshSelectionButtons();
      drawSelection();
    }
    function selectObject(id, additive) { selectIds(id ? [id] : [], additive); }

    function drawSelection() {
      selectionLayer.replaceChildren();
      const objs = selectedObjects();
      if (!objs.length) return;
      if (state.tool === "reshape" && objs.length) { drawReshape(); return; }
      const box = unionBox(objs);
      const corners = [
        {x:box.x,y:box.y},{x:box.x+box.w,y:box.y},{x:box.x+box.w,y:box.y+box.h},{x:box.x,y:box.y+box.h}
      ];
      const [nw,ne,se,sw] = corners;
      const mid = { n:{x:(nw.x+ne.x)/2,y:(nw.y+ne.y)/2}, e:{x:(ne.x+se.x)/2,y:(ne.y+se.y)/2}, s:{x:(se.x+sw.x)/2,y:(se.y+sw.y)/2}, w:{x:(sw.x+nw.x)/2,y:(sw.y+nw.y)/2} };
      selectionLayer.append(createEl("polygon", { points: corners.map(p=>`${p.x},${p.y}`).join(" "), fill:"none", stroke:"#4c97ff", "stroke-width": 1.2 / state.zoom, "stroke-dasharray":"5 4" }));
      const rot = { x: mid.n.x, y: mid.n.y - 28 / state.zoom };
      selectionLayer.append(createEl("line", { x1:mid.n.x, y1:mid.n.y, x2:rot.x, y2:rot.y, stroke:"#4c97ff", "stroke-width": 1.2 / state.zoom }));
      const rh = createEl("circle", { class:"rot-handle", cx:rot.x, cy:rot.y, r: 7 / state.zoom, fill:"#fff", stroke:"#855cd6", "stroke-width": 2 / state.zoom, "data-handle":"rot" });
      selectionLayer.append(rh);
      const hs = { nw, n:mid.n, ne, e:mid.e, se, s:mid.s, sw, w:mid.w };
      const s = 10 / state.zoom;
      for (const [name,p] of Object.entries(hs)) {
        selectionLayer.append(createEl("rect", { class:"handle", x:p.x-s/2, y:p.y-s/2, width:s, height:s, fill:"#fff", stroke:"#4c97ff", "stroke-width": 1.5 / state.zoom, "data-handle":name }));
      }
    }
    function eventEl(evt, selector) {
      const path = typeof evt.composedPath === "function" ? evt.composedPath() : [evt.target];
      for (const n of path) {
        if (n && n.matches && n.matches(selector)) return n;
      }
      return evt.target?.closest?.(selector) || null;
    }
    function findById(list, id) {
      for (const o of list || []) {
        if (o.id === id) return o;
        if (o.children) {
          const hit = findById(o.children, id);
          if (hit) return hit;
        }
      }
      return null;
    }
    function listReshapeItems() {
      const out = [];
      const walk = (obj, parentMat) => {
        const mat = multiply(parentMat, obj.matrix || identity());
        if (obj.type === "group") (obj.children || []).forEach((ch) => walk(ch, mat));
        else if (obj.type === "path" || obj.type === "line" || obj.type === "rect" || obj.type === "ellipse") out.push({ obj, mat });
      };
      selectedObjects().forEach((o) => walk(o, identity()));
      return out;
    }
    function parsePathCommands(d) {
      const cmds = [];
      const re = /([MLHVCSQTAZmlhvcsqtaz])([^MLHVCSQTAZmlhvcsqtaz]*)/g;
      let x=0, y=0, startX=0, startY=0, prev=null, match;
      while ((match = re.exec(d || ""))) {
        const type = match[1];
        const nums = match[2].trim().split(/[\s,]+/).filter(Boolean).map(Number);
        const abs = type === type.toUpperCase();
        const c = type.toUpperCase();
        const nx = (v) => abs ? v : x + v;
        const ny = (v) => abs ? v : y + v;
        if (c === "Z") {
          cmds.push({ c: "Z" });
          x = startX; y = startY; prev = cmds[cmds.length-1];
          continue;

    function fillLuma(fill) {

    function pruneObjectList(list) {

      if (layers.length < 3) return 0;

    function cleanHaloJunkSelected() {
      const sel = selectedObjects();

        if (obj.type !== "group" || !obj.children) return 0;
        let n = pruneObjectList(obj.children);

        const layers = [];

        if (layers.length >= 3) {
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          layers.forEach((l) => {
            minX = Math.min(minX, l.box.minX); minY = Math.min(minY, l.box.minY);
            maxX = Math.max(maxX, l.box.maxX); maxY = Math.max(maxY, l.box.maxY);

            state.objects = state.objects.filter((o) => !drop.has(o.id));
            state.selectedIds = state.selectedIds.filter((id) => !drop.has(id));

          }
        }
      }
      if (!removed) {
        const prev = state.history.pop();
        if (prev) {
          state.objects = clone(prev.objects);
          state.selectedIds = prev.selectedIds || [];
        }

        toast("消せるゴミは見つかりませんでした");

    function ungroupSelected() {

    function constrainedRect(a,b,square) {

    function objectFromPreview(start, now, shift) {

    function handleScaleAll(objs, gesture, mouse, shiftKey) {

      if (obj.type==="rect") return `<rect x="${obj.x}" y="${obj.y}" width="${obj.width}" height="${obj.height}" ${f} ${s}/>`;
      if (obj.type==="ellipse") return `<ellipse cx="${obj.cx}" cy="${obj.cy}" rx="${obj.rx}" ry="${obj.ry}" ${f} ${s}/>`;
      if (obj.type==="text") return `<text x="${obj.x}" y="${obj.y}" font-size="${obj.fontSize}" font-family="${(obj.fontFamily||"sans-serif").replace(/"/g,"'")}" ${f} ${s}>${obj.text}</text>`;

        for (let i=0;i<len;i++) {
          const a=p[i], b=p[(i+1)%len];
          n.push([0.75*a[0]+0.25*b[0], 0.75*a[1]+0.25*b[1]]);
          n.push([0.25*a[0]+0.75*b[0], 0.25*a[1]+0.75*b[1]]);
        }
        p = n;
      }
      p.push([p[0][0], p[0][1]]);
      return p;
    }
    function loopArea(pts) {
      let a=0;
      for (let i=0;i<pts.length-1;i++) a += pts[i][0]*pts[i+1][1] - pts[i+1][0]*pts[i][1];
      return a/2;
    }
    function loopToPath(pts) {
      let d = `M ${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
      for (let i=1;i<pts.length;i++) d += ` L ${pts[i][0].toFixed(2)} ${pts[i][1].toFixed(2)}`;
      return d + " Z";
    }
    function loopBBox(pts) {
      let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      for (const p of pts) {
        if (p[0]<minX) minX=p[0]; if (p[0]>maxX) maxX=p[0];
        if (p[1]<minY) minY=p[1]; if (p[1]>maxY) maxY=p[1];
      }
      return { minX, minY, maxX, maxY, cx:(minX+maxX)/2, cy:(minY+maxY)/2 };
    }
    function inflateBox(b, p) {
      return { minX:b.minX-p, minY:b.minY-p, maxX:b.maxX+p, maxY:b.maxY+p };
    }
    function boxesOverlap(a, b) {
      return a.minX <= b.maxX && a.maxX >= b.minX && a.minY <= b.maxY && a.maxY >= b.minY;
    }
    function pointInBox(b, x, y) {
      return x >= b.minX && x <= b.maxX && y >= b.minY && y <= b.maxY;
    }
    function pruneHaloJunk(layers, imgW, imgH) {
      if (!layers.length || layers.length < 3) return layers;
      const maxA = layers.reduce((m, l) => Math.max(m, l.area), 0);
      const imgA = Math.max(1, imgW * imgH);
      const coreMin = Math.max(maxA * 0.035, imgA * 0.002, 60);
      const bodyCore = layers.filter((l) => !l.dark && l.area >= coreMin);
      const cores = bodyCore.length ? bodyCore : layers.filter((l) => l.area >= coreMin);
      if (!cores.length) return layers;
      const pad = Math.max(16, Math.round(Math.min(imgW, imgH) * 0.045));
      const coreBoxes = cores.map((l) => inflateBox(l.box, pad));
      const onFigure = (l) => coreBoxes.some((b) => pointInBox(b, l.box.cx, l.box.cy) || boxesOverlap(b, inflateBox(l.box, 2)));
      const kept = layers.filter((l) => {
        if (l.area >= coreMin) return true;
        if (!onFigure(l)) return false;
        if (!l.dark && l.area < 8) return false;
        return true;
      });
      return kept.length ? kept : layers;
    }
    async function traceBitmapToSvg(dataUrl) {
      aiStatus("トレースボット: 画像を読み込んでいます...");
      await tick();
      const { imgData, w, h } = await loadImageData(dataUrl, 640);
      aiStatus("トレースボット: 色をまとめています...");
      await tick();
      const palette = ensureKeyColors(medianCutPalette(imgData, 18));
      if (!palette.length) throw new Error("トレーできる色が見つかりませんでした");
      const labels = quantize(imgData, palette);
      const minPixels = Math.max(8, Math.round(w * h * 0.00025));
      const layers = [];
      for (let pi=0; pi<palette.length; pi++) {
        if (pi % 2 === 0) {
          aiStatus(`トレースボット: 輪郭をたどっています (${pi+1}/${palette.length})...`);
          await tick();
        }
        const [r,g,b] = palette[pi];
        const dark = lumaOf(palette[pi]) < 48;
        const mask = colorMask(labels, pi, w, h, dark ? 1 : minPixels);
        if (!mask) continue;
        if (!dark) removeSpeckles(mask, w, h, 8);
        const comps = connectedComponents(mask, w, h, dark ? 1 : 4);
        const fill = rgbHex(r,g,b);
        for (const comp of comps) {
          const segs = extractSegments(comp.mask, comp.w, comp.h);
          if (!segs.length) continue;
          let loops = stitchLoops(segs).map((loop) => {
            const rawArea = Math.abs(loopArea(loop));
            const small = loop.length < 48 || rawArea < 90;
            let s = simplifyClosed(loop, small ? 0.3 : 1.0);
            if (!small && !dark) s = chaikinClosed(s, 2);
            s = simplifyClosed(s, small || dark ? 0.18 : 0.5);
            return s.map((pt) => [pt[0] + comp.ox, pt[1] + comp.oy]);
          }).filter((loop) => Math.abs(loopArea(loop)) >= (dark ? 0.4 : 3));
          if (!loops.length) continue;
          loops.sort((a,b) => Math.abs(loopArea(b)) - Math.abs(loopArea(a)));
          const outer = loops[0];
          const d = loopToPath(outer);
          const area = Math.abs(loopArea(outer));
          layers.push({ d, fill, area, dark, box: loopBBox(outer) });
        }
      }
      if (!layers.length) throw new Error("輪郭を取り出せませんでした");
      const cleaned = pruneHaloJunk(layers, w, h);
      cleaned.sort((a,b) => {
        const aDetail = a.dark && a.area < 1200;
        const bDetail = b.dark && b.area < 1200;
        if (aDetail !== bDetail) return aDetail ? 1 : -1;
        return b.area - a.area;
      });
      const paths = cleaned.map((l) => `<path fill="${l.fill}" stroke="none" fill-rule="nonzero" d="${l.d}"/>`).join("");
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${paths}</svg>`;
    }

    function parseTransform(str) {
      if (!str) return identity(); let m=identity(); const re=/(matrix|translate|scale|rotate)\(([^)]+)\)/g; let match;
      while ((match=re.exec(str))) { const args=match[2].trim().split(/[\s,]+/).map(Number);
        if (match[1]==="matrix"&&args.length>=6) m=multiply(m,args.slice(0,6));
        if (match[1]==="translate") m=multiply(m,mTranslate(args[0]||0,args[1]||0));
        if (match[1]==="scale") m=multiply(m,mScale(args[0]||1, args[1]??args[0]??1));
        if (match[1]==="rotate") { const rad=((args[0]||0)*Math.PI)/180; m = args.length>=3 ? multiply(m, multiply(mTranslate(args[1],args[2]), multiply(mRotate(rad), mTranslate(-args[1],-args[2])))) : multiply(m,mRotate(rad)); }
      }
      return m;
    }
    function readPaint(el, inherited) {
      const style={}; (el.getAttribute("style")||"").split(";").forEach(part=>{ const [k,v]=part.split(":"); if(k&&v) style[k.trim()]=v.trim(); });
      const fill=el.getAttribute("fill")||style.fill||inherited.fill; const stroke=el.getAttribute("stroke")||style.stroke||inherited.stroke;
      const swRaw=el.getAttribute("stroke-width")||style["stroke-width"]; const strokeWidth=swRaw?parseFloat(swRaw):inherited.strokeWidth;
      const rule=el.getAttribute("fill-rule")||style["fill-rule"]||inherited.fillRule;
      return { fill: fill||"#000", stroke: stroke||"none", strokeWidth: Number.isFinite(strokeWidth)?strokeWidth:0, fillRule: rule||"evenodd" };
    }
    function polygonToPath(points, close) {
      const nums=String(points||"").trim().split(/[\s,]+/).filter(Boolean); if(nums.length<4) return "";
      let d=""; for(let i=0;i+1<nums.length;i+=2) d+=`${i?"L":"M"} ${nums[i]} ${nums[i+1]} `; if(close) d+="Z"; return d.trim();
    }
    function parseSvgObjects(markup) {
      const doc=new DOMParser().parseFromString(markup,"image/svg+xml"); const root=doc.documentElement;
      if (!root || root.nodeName.toLowerCase()!=="svg" || doc.querySelector("parsererror")) throw new Error("SVGを解析できませんでした");
      const imported=[]; const skip=new Set(["defs","clippath","mask","filter","style","script","title","desc"]);
      function walk(el, inherited, parentMat) {
        const tag=el.localName.toLowerCase(); if (skip.has(tag)) return;
        const paint=readPaint(el,inherited); const mat=multiply(parentMat, parseTransform(el.getAttribute("transform"))); let obj=null;
        if (tag==="path"&&el.getAttribute("d")) obj={ type:"path", d:el.getAttribute("d"), fillRule: paint.fillRule };
        else if (tag==="rect") obj={ type:"rect", x:+el.getAttribute("x")||0, y:+el.getAttribute("y")||0, width:+el.getAttribute("width")||0, height:+el.getAttribute("height")||0 };
        else if (tag==="circle") { const r=+el.getAttribute("r")||0; obj={ type:"ellipse", cx:+el.getAttribute("cx")||0, cy:+el.getAttribute("cy")||0, rx:r, ry:r }; }
        else if (tag==="ellipse") obj={ type:"ellipse", cx:+el.getAttribute("cx")||0, cy:+el.getAttribute("cy")||0, rx:+el.getAttribute("rx")||0, ry:+el.getAttribute("ry")||0 };
        else if (tag==="line") obj={ type:"line", x1:+el.getAttribute("x1")||0, y1:+el.getAttribute("y1")||0, x2:+el.getAttribute("x2")||0, y2:+el.getAttribute("y2")||0 };
        else if (tag==="polygon"||tag==="polyline") { const d=polygonToPath(el.getAttribute("points"), tag==="polygon"); if(d) obj={ type:"path", d, fillRule: paint.fillRule }; }
        else if (tag==="text") obj={ type:"text", x:+el.getAttribute("x")||0, y:+el.getAttribute("y")||0, text: el.textContent||"", fontSize: parseFloat(el.getAttribute("font-size")||28), fontFamily: el.getAttribute("font-family") || "sans-serif" };
        if (obj) imported.push({ id:uid(), ...obj, fill: obj.type==="line"?"none":paint.fill, stroke:paint.stroke, strokeWidth:paint.strokeWidth, matrix:mat });
        [...el.children].forEach((child)=>walk(child,paint,mat));
      }
      [...root.children].forEach((child)=>walk(child,{fill:"#000",stroke:"none",strokeWidth:0,fillRule:"evenodd"},identity()));
      if (!imported.length) throw new Error("取り込み可能な図形が見つかりませんでした");
      return imported;
    }
    function placeImportedGroup(group) {
      applyView();
      const el = document.getElementById(group.id);
      const r = canvas.getBoundingClientRect();
      if (!el || r.width < 8 || r.height < 8) return;
      const bbox = el.getBBox();
      const vw = r.width / state.zoom;
      const vh = r.height / state.zoom;
      const target = Math.min(vw, vh) * 0.62;
      const scale = target / Math.max(bbox.width || 1, bbox.height || 1, 1);
      const cx = state.panX + vw / 2;
      const cy = state.panY + vh / 2;
      const bx = bbox.x + (bbox.width || 0) / 2;
      const by = bbox.y + (bbox.height || 0) / 2;
      group.matrix = multiply(multiply(mTranslate(cx, cy), mScale(scale, scale)), mTranslate(-bx, -by));
    }
    function afterLayout(fn) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (canvas.getBoundingClientRect().width < 8) setTimeout(fn, 50);
        else fn();
      }));
    }
    function importSvgToCanvas(markup) {
      const imported = parseSvgObjects(markup);
      snapshot();
      const group = { id: uid(), type:"group", children: imported, fill:"none", stroke:"none", strokeWidth:0, matrix: identity() };
      state.objects.push(group);
      showCanvasView();
      applyView();
      renderObjects();
      afterLayout(() => {
        placeImportedGroup(group);
        renderObjects();
        selectIds([group.id]);
        setTool("select");
        drawSelection();
        toast("キャンバス中央に取り込みました");
      });
    }

    document.getElementById("btn-ai").addEventListener("click", showImportView);
    document.getElementById("btn-close-ai").addEventListener("click", showCanvasView);
    document.getElementById("btn-close-ai-2").addEventListener("click", showCanvasView);
    document.querySelectorAll(".import-tabs button").forEach((tab)=>tab.addEventListener("click", ()=>{
      document.querySelectorAll(".import-tabs button").forEach((t)=>t.classList.toggle("active", t===tab));
      document.getElementById("panel-upload").classList.toggle("hidden", tab.dataset.tab!=="upload");
      document.getElementById("panel-generate").classList.toggle("hidden", tab.dataset.tab!=="generate");
    }));
    document.getElementById("file").addEventListener("change", async ()=>{ const file=document.getElementById("file").files?.[0]; if(!file) return; try{ showSource(await fileToDataUrl(file)); }catch(err){ aiStatus(err.message,true); } });
    const dropzone=document.getElementById("dropzone");
    ["dragenter","dragover"].forEach(ev=>dropzone.addEventListener(ev,e=>{ e.preventDefault(); dropzone.classList.add("drag"); }));
    ["dragleave","drop"].forEach(ev=>dropzone.addEventListener(ev,e=>{ e.preventDefault(); dropzone.classList.remove("drag"); }));
    dropzone.addEventListener("drop", async e=>{ const file=e.dataTransfer.files?.[0]; if(!file||!file.type.startsWith("image/")) return aiStatus("画像ファイルをドロップしてください",true); try{ showSource(await fileToDataUrl(file)); }catch(err){ aiStatus(err.message,true); } });
    document.querySelectorAll(".ex").forEach(btn=>btn.addEventListener("click", ()=>{ document.getElementById("prompt").value=btn.dataset.prompt; }));
    function setAiBusy(on,label){ ai.busy=on; const convert=document.getElementById("btn-convert"); const gen=document.getElementById("btn-generate"); convert.disabled=on||!ai.sourceDataUrl; gen.disabled=on; convert.innerHTML=on?`<span class="spinner"></span>${label||"処理中"}`:"トレースしてキャンバスへ"; }
    document.getElementById("btn-generate").addEventListener("click", async ()=>{
      const prompt=document.getElementById("prompt").value.trim(); if(!prompt) return aiStatus("プロンプトを入力してください",true);
      setAiBusy(true,"画像を生成中..."); aiStatus("画像を生成しています...");
      try{ showSource(await loadGeneratedImage(prompt)); aiStatus("生成しました。続けてトレースできます"); }catch(err){ aiStatus(err.message||"画像生成に失敗しました",true); } finally{ setAiBusy(false); }
    });
    document.getElementById("btn-convert").addEventListener("click", async ()=>{
      if(!ai.sourceDataUrl) return aiStatus("先に画像を用意してください",true);
      setAiBusy(true,"トレースボットで変換中...");
      try{
        const svg=await traceBitmapToSvg(ai.sourceDataUrl);
        ai.svgMarkup=svg;
        showSvgPreview(svg);
        importSvgToCanvas(svg);
      }catch(err){ aiStatus(err.message||"変換に失敗しました",true); } finally{ setAiBusy(false); }
    });
  </script>
